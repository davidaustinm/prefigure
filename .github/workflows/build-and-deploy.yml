name: Build and deploy to github pages

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["*"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages, and
# packages:write so the built dev container image can be cached to GHCR.
permissions:
    contents: read
    pages: write
    id-token: write
    packages: write

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            # Log in to GHCR so devcontainers/ci can pull the cached dev
            # container image and (on main-branch pushes) push the updated one.
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            # Build and test inside the repo's dev container (.devcontainer/),
            # which provides all toolchains: Python 3.12 + poetry, Node, the
            # Rust toolchain with the wasm32 target and wasm-pack, and cairo /
            # rsvg. The wasm-pack toolchain is required because the playground
            # build (`build:js`) now compiles the Rust port to WebAssembly and
            # bundles it; wireit builds the Python wheel and both wasm flavors
            # before Vite runs. The workspace is mounted, so the resulting
            # packages/playground/dist/ is available to the steps below.
            #
            # Caching: the image is layer-cached in GHCR. `push: filter` only
            # pushes on pushes to the default branch (main), so PR runs reuse
            # the cache without publishing. This workflow is the publisher;
            # tests.yml consumes the same image as a read-only cache source.
            - name: Build and test in dev container
              uses: devcontainers/ci@v0.3
              with:
                  configFile: .devcontainer/devcontainer.json
                  imageName: ghcr.io/${{ github.repository }}/devcontainer
                  cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
                  push: filter
                  # poetry is installed with `pip install --user`; put it on PATH
                  # for this non-interactive shell. cargo/wasm-pack are already on
                  # the global PATH from the Rust dev container feature.
                  env: |
                      CI=false
                  runCmd: |
                      export PATH="$HOME/.local/bin:$PATH"
                      npm run test:js
                      npm run build:js

            - name: Prepare for Github Pages
              run: |
                  mkdir -p ./website_dist
                  cp -r ./packages/playground/dist/* ./website_dist
                  echo "These are the files that will be packaged"
                  ls ./website_dist

            - name: Package website deployment
              uses: actions/upload-pages-artifact@v5
              id: website_dist
              with:
                  path: ./website_dist

    deploy:
        if: ${{ github.event_name == 'push' }}
        environment:
            name: github-pages
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: website_dist
              uses: actions/deploy-pages@v5
