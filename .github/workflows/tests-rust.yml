name: rust tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# Read-only access to GHCR so the cached dev container image can be pulled.
permissions:
  contents: read
  packages: read

jobs:
  test:
    # Runs inside the repo's dev container (.devcontainer/), which already
    # provides every toolchain the suite needs: Python 3.12 + poetry, Node,
    # the Rust toolchain with the wasm32 target and wasm-pack, and the cairo /
    # rsvg system libraries. Building the image runs postCreateCommand.sh, which
    # installs poetry, the wasm build tools, and the npm workspace deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Log in to GHCR so the cached dev container image can be pulled. This
      # workflow only consumes the cache (push: never); build-and-deploy.yml
      # publishes it on main-branch pushes.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run Rust tests in dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          # The Rust port (packages/prefig-rust) is tested against the SAME
          # shared snapshots (packages/tests/snapshots) that the Python suite
          # checks, so a Python-side change that regenerates a snapshot must be
          # mirrored in Rust. `prefig init` is still needed here: the Rust
          # `rust_output_matches_python` test renders math labels by shelling out
          # to node/MathJax (LocalMathLabels), and `prefig init` installs the
          # MathJax bundle. poetry is installed with `pip install --user`, so make
          # sure ~/.local/bin is on PATH for this non-interactive shell.
          # `set -e` so a failure in any step (not just the last) fails the job.
          runCmd: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            poetry run prefig init
            cargo test --manifest-path packages/prefig-rust/Cargo.toml

  # Formatting and lint checks for the Rust port. Kept separate from the test
  # job above (which needs the whole dev container) because fmt and clippy need
  # only the Rust toolchain: clippy is check-only, so it does not link, and the
  # crate's cairo FFI (#[link(name = "cairo")]) needs no system library here.
  lint:
    name: Lint Rust (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: cargo fmt
        working-directory: ./packages/prefig-rust
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: ./packages/prefig-rust
        run: cargo clippy -- -D warnings
