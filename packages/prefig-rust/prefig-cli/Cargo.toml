[package]
name = "prefig-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for PreFigure"

[[bin]]
name = "prefig"
path = "src/main.rs"

[dependencies]
# text-cairo gives the native build real text measurement, like `prefig build`
prefig-core = { path = "../prefig-core", features = ["text-cairo"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
